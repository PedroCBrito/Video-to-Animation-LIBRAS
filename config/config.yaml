# Configurações do Pipeline FreeMoCap Video-to-Animation

# Caminho para o executável do Blender (será detectado automaticamente ou especificado aqui)
blender:
  executable: "C:/Program Files/Blender Foundation/Blender 5.2/blender.exe"
  fallback_paths:
    - "C:/Program Files/Blender Foundation/Blender 4.3/blender.exe"
    - "C:/Program Files/Blender Foundation/Blender 4.2/blender.exe"
    - "C:/Program Files/Blender Foundation/Blender 3.6/blender.exe"

# Parâmetros de Filtro e Processamento 3D
processing:
  butterworth_cutoff_hz: 6.0
  enable_foot_locking: true
  tracking_backend: "mediapipe"  # mediapipe / openpose / skellytracker

# Formato e Configurações de Exportação
export:
  default_format: "fbx" # fbx, gltf, bvh, mp4
  render_video: true
